name: Build Firmware

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "west.yml"
      - "CMakeLists.txt"
      - "Kconfig"
      - "prj.conf"
      - "boards/**"
      - "config/**"
      - "main/**"
      - "snippets/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "west.yml"
      - "CMakeLists.txt"
      - "Kconfig"
      - "prj.conf"
      - "boards/**"
      - "config/**"
      - "main/**"
      - "snippets/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile to run"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - dev-usb-logging
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Select build matrix
        id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          profiles=(release)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${REQUESTED_PROFILE:-release}" in
              release)
                profiles=(release)
                ;;
              dev-usb-logging)
                profiles=(dev-usb-logging)
                ;;
              all)
                profiles=(release dev-usb-logging)
                ;;
              *)
                printf 'Unsupported profile selection: %s\n' "${REQUESTED_PROFILE}" >&2
                exit 1
                ;;
            esac
          fi

          matrix='['
          for profile in "${profiles[@]}"; do
            artifact_name="zmk-usb-bridge-${profile}-seeeduino_xiao_ble"
            matrix+="{\"board\":\"seeeduino_xiao_ble\",\"profile\":\"${profile}\",\"artifact_name\":\"${artifact_name}\"},"
          done
          matrix="${matrix%,}]"

          echo "matrix=${matrix}" >>"$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository into west workspace path
        uses: actions/checkout@v4
        with:
          path: zmk-usb-bridge
          persist-credentials: false

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            zephyr/
            modules/
            tools/
            bootloader/
          key: ${{ runner.os }}-west-3.5-${{ hashFiles('zmk-usb-bridge/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-3.5-
            ${{ runner.os }}-west-

      - name: Initialize west workspace
        shell: bash
        run: west init -l zmk-usb-bridge

      - name: Update west modules
        shell: bash
        run: west update --fetch-opt=--filter=tree:0

      - name: Export Zephyr CMake package
        shell: bash
        run: west zephyr-export

      - name: Build ${{ matrix.profile }} / ${{ matrix.board }}
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          BOARD: ${{ matrix.board }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          mkdir -p "artifacts/${ARTIFACT_NAME}"
          zmk-usb-bridge/scripts/ci_build_bundle.sh \
            --workspace-dir "${GITHUB_WORKSPACE}" \
            --project-dir "${GITHUB_WORKSPACE}/zmk-usb-bridge" \
            --artifact-dir "${GITHUB_WORKSPACE}/artifacts/${ARTIFACT_NAME}" \
            --profile "${PROFILE}" \
            --board "${BOARD}" \
            --pristine always \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload ${{ matrix.profile }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
